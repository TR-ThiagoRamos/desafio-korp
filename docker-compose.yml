version: '3.8'

# Rede em modo bridge para comunicação interna entre containers
networks:
  korp-network:
    driver: bridge

services:
  # Serviço Backend da API Go
  http-server-projeto-korp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: http-server-projeto-korp
    networks:
      - korp-network

  # Proxy Reverso Nginx
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - korp-network
    depends_on:
      - http-server-projeto-korp

  # Coletor de métricas Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - korp-network

  # Dashboard visual Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - korp-network